name: Unzip Uploaded Project

on:
  push:
    paths:
      - '*.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract the uploaded zip
        run: |
          ZIPFILE=$(ls *.zip | head -n 1)
          echo "Found: $ZIPFILE"
          mkdir -p _extracted
          unzip -q "$ZIPFILE" -d _extracted
          INNER_FOLDER=$(ls _extracted)
          echo "Inner folder: $INNER_FOLDER"
          shopt -s dotglob
          cp -r "_extracted/$INNER_FOLDER"/* .
          rm -rf "_extracted/$INNER_FOLDER"
          rm -rf _extracted
          rm -f "$ZIPFILE"

      - name: Commit the extracted project
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git commit -m "Extract uploaded project" || echo "Nothing to commit"
          git push
